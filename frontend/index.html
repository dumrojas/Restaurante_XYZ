<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Restaurante XYZ</title>
</head>
<body>
  <p>Redirigiendo...</p>
  <script src="assets/js/api/api.js"></script>
  <script>
    (async () => {
      if (!TokenStore.get()) {
        window.location.replace('pages/auth/login.html');
        return;
      }

      try {
        const respuesta = await api.auth.sesion();
        TokenStore.setUser(respuesta.usuario);
        window.location.replace('pages/reservas/reservas.html');
      } catch (error) {
        TokenStore.clear();
        window.location.replace('pages/auth/login.html');
      }
    })();
  </script>
</body>
</html>
