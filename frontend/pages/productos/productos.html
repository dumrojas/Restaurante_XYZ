<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Productos - Restaurante XYZ</title>
  <link rel="stylesheet" href="../../assets/css/styles.css">
</head>
<body>
  <div class="container split">
    <header class="page-head">
      <h1>Productos</h1>
      <p>La carta del salón: precios, categorías y disponibilidad.</p>
    </header>

    <section class="card">
      <h2 id="titulo-producto">Nuevo producto</h2>
      <form id="producto-form">
        <div class="form-grid">
          <label>
            Nombre
            <input type="text" name="nombre" required>
          </label>
          <label>
            Categoría
            <input type="text" name="categoria" list="categorias-list" required>
          </label>
          <label>
            Precio
            <input type="number" name="precio" min="0.01" step="0.01" required>
          </label>
          <label>
            Descripción
            <input type="text" name="descripcion">
          </label>
          <label class="check">
            <input type="checkbox" name="disponible" checked>
            Disponible
          </label>
        </div>
        <datalist id="categorias-list"></datalist>
        <div class="form-actions">
          <button type="button" class="btn btn-small btn-secondary" id="cancelar-producto" hidden>Cancelar edición</button>
          <button type="submit" class="btn" id="guardar-producto">Guardar producto</button>
        </div>
      </form>
    </section>

    <section class="card">
      <h2>Carta</h2>

      <form id="filtro-form" class="form-block">
        <div class="form-grid">
          <label>
            Categoría
            <select name="categoria_id" id="filtro-categoria">
              <option value="">Todas</option>
            </select>
          </label>
          <label>
            Disponibilidad
            <select name="disponible" id="filtro-disponible">
              <option value="">Todas</option>
              <option value="true">Disponibles</option>
              <option value="false">Agotados</option>
            </select>
          </label>
        </div>
        <div class="form-actions">
          <button type="button" class="btn btn-small btn-secondary" id="limpiar-filtro">Limpiar</button>
          <button type="submit" class="btn btn-small">Buscar</button>
        </div>
      </form>

      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>Nombre</th>
              <th>Categoría</th>
              <th>Precio</th>
              <th>Disponible</th>
              <th>Acciones</th>
            </tr>
          </thead>
          <tbody id="productos-body"></tbody>
        </table>
      </div>
    </section>
  </div>

  <script src="../../assets/js/api/api.js"></script>
  <script src="../../assets/js/utils/helpers.js"></script>
  <script src="../../assets/js/components/navbar.js"></script>
  <script>
    if (requireSession()) {
      renderNav('productos');

      const productosBody = document.getElementById('productos-body');
      const productoForm = document.getElementById('producto-form');
      const categoriasList = document.getElementById('categorias-list');
      const filtroCategoria = document.getElementById('filtro-categoria');
      const filtroDisponible = document.getElementById('filtro-disponible');
      const filtroForm = document.getElementById('filtro-form');
      const guardarProducto = document.getElementById('guardar-producto');
      const cancelarProducto = document.getElementById('cancelar-producto');
      const tituloProducto = document.getElementById('titulo-producto');
      const categoriaInput = productoForm.categoria;

      let categoriasPorId = {};
      let productosPorId = {};
      let filtrosActuales = {};
      let editandoProductoId = null;

      async function cargarCategorias() {
        try {
          const categorias = await api.productos.categorias();
          const seleccionada = filtroCategoria.value;

          categoriasPorId = {};
          categoriasList.innerHTML = '';
          filtroCategoria.innerHTML = '<option value="">Todas</option>';

          categorias.forEach((categoria) => {
            categoriasPorId[categoria.id] = categoria.nombre;

            const sugerencia = document.createElement('option');
            sugerencia.value = categoria.nombre;
            categoriasList.appendChild(sugerencia);

            const opcion = document.createElement('option');
            opcion.value = categoria.id;
            opcion.textContent = categoria.nombre;
            filtroCategoria.appendChild(opcion);
          });

          if (seleccionada) {
            filtroCategoria.value = seleccionada;
          }
        } catch (error) {
          showMessage(error.message || 'No se pudieron cargar las categorías', 'error');
        }
      }

      function reiniciarFormulario() {
        editandoProductoId = null;
        productoForm.reset();
        productoForm.disponible.checked = true;
        tituloProducto.textContent = 'Nuevo producto';
        guardarProducto.textContent = 'Guardar producto';
        cancelarProducto.hidden = true;
      }

      async function cargarProductos() {
        try {
          const productos = await api.productos.listar(filtrosActuales);

          productosBody.innerHTML = '';
          productosPorId = {};

          if (!productos.length) {
            productosBody.innerHTML = '<tr><td colspan="5" class="empty">No hay productos registrados</td></tr>';
            return;
          }

          productos.forEach((producto) => {
            productosPorId[producto.id] = producto;
            const disponible = Number(producto.disponible) === 1;

            const fila = document.createElement('tr');
            fila.innerHTML =
              '<td>' + escapeHtml(producto.nombre) + '</td>' +
              '<td>' + escapeHtml(categoriasPorId[producto.categoria_id] || 'Sin categoría') + '</td>' +
              '<td>' + escapeHtml(formatMoney(producto.precio)) + '</td>' +
              '<td><span class="badge ' + (disponible ? 'badge-disponible' : 'badge-cancelado') + '">' +
                (disponible ? 'Sí' : 'No') + '</span></td>' +
              '<td><div class="actions">' +
                '<button type="button" class="btn btn-small btn-secondary" data-accion="editar" ' +
                  'data-id="' + producto.id + '">Editar</button>' +
                '<button type="button" class="btn btn-small btn-secondary" data-accion="disponible" ' +
                  'data-id="' + producto.id + '" data-valor="' + (disponible ? '0' : '1') + '">' +
                  (disponible ? 'Marcar agotado' : 'Marcar disponible') + '</button>' +
                '<button type="button" class="btn btn-small btn-danger" data-accion="eliminar" ' +
                  'data-id="' + producto.id + '">Eliminar</button>' +
              '</div></td>';
            productosBody.appendChild(fila);
          });
        } catch (error) {
          showMessage(error.message || 'No se pudieron cargar los productos', 'error');
        }
      }

      productosBody.addEventListener('click', async (event) => {
        const boton = event.target.closest('button[data-accion]');

        if (!boton) {
          return;
        }

        if (boton.dataset.accion === 'editar') {
          const producto = productosPorId[boton.dataset.id];

          if (!producto) {
            return;
          }

          editandoProductoId = producto.id;
          productoForm.nombre.value = producto.nombre;
          categoriaInput.value = categoriasPorId[producto.categoria_id] || '';
          productoForm.precio.value = producto.precio;
          productoForm.descripcion.value = producto.descripcion || '';
          productoForm.disponible.checked = Number(producto.disponible) === 1;
          tituloProducto.textContent = 'Editar producto';
          guardarProducto.textContent = 'Actualizar producto';
          cancelarProducto.hidden = false;
          productoForm.scrollIntoView({ behavior: 'smooth', block: 'center' });
          return;
        }

        boton.disabled = true;

        try {
          if (boton.dataset.accion === 'eliminar') {
            if (!confirm('¿Eliminar este producto?')) {
              boton.disabled = false;
              return;
            }

            await api.productos.eliminar(boton.dataset.id);
            showMessage('Producto eliminado', 'success');
          } else {
            await api.productos.actualizar(boton.dataset.id, {
              disponible: boton.dataset.valor === '1',
            });
            showMessage('Producto actualizado', 'success');
          }

          await cargarProductos();
        } catch (error) {
          showMessage(error.message || 'No se pudo actualizar el producto', 'error');
          boton.disabled = false;
        }
      });

      cancelarProducto.addEventListener('click', reiniciarFormulario);

      productoForm.addEventListener('submit', async (event) => {
        event.preventDefault();

        if (!validateRequired(productoForm)) {
          return;
        }

        const precio = Number(productoForm.precio.value);

        if (!(precio > 0)) {
          showMessage('El precio debe ser mayor a cero', 'error');
          return;
        }

        const producto = {
          nombre: productoForm.nombre.value.trim(),
          categoria: categoriaInput.value.trim(),
          precio,
          descripcion: productoForm.descripcion.value.trim(),
          disponible: productoForm.disponible.checked,
        };

        guardarProducto.disabled = true;

        try {
          if (editandoProductoId) {
            await api.productos.actualizar(editandoProductoId, producto);
            showMessage('Producto actualizado', 'success');
          } else {
            await api.productos.crear(producto);
            showMessage('Producto guardado', 'success');
          }

          reiniciarFormulario();
          await cargarCategorias();
          await cargarProductos();
        } catch (error) {
          showMessage(error.message || 'No se pudo guardar el producto', 'error');
        } finally {
          guardarProducto.disabled = false;
        }
      });

      filtroForm.addEventListener('submit', (event) => {
        event.preventDefault();
        filtrosActuales = {
          categoria_id: filtroCategoria.value,
          disponible: filtroDisponible.value,
        };
        cargarProductos();
      });

      document.getElementById('limpiar-filtro').addEventListener('click', () => {
        filtroForm.reset();
        filtrosActuales = {};
        cargarProductos();
      });

      (async () => {
        await cargarCategorias();
        await cargarProductos();
      })();
    }
  </script>
</body>
</html>
