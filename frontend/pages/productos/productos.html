<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Productos - Restaurante XYZ</title>
  <link rel="stylesheet" href="../../assets/css/styles.css">
</head>
<body>
  <div class="container split">
    <header class="page-head">
      <h1>Productos</h1>
      <p>La carta del salón: precios, categorías y disponibilidad.</p>
    </header>

    <section class="card">
      <h2 id="titulo-producto">Nuevo producto</h2>
      <form id="producto-form">
        <div class="form-grid">
          <label>
            Nombre
            <input type="text" name="nombre" required>
          </label>
          <label>
            Categoría
            <select name="categoria" required>
              <option value="">Selecciona una categoría</option>
              <option value="Entradas">Entradas</option>
              <option value="Bebidas">Bebidas</option>
              <option value="Platos fuertes">Platos fuertes</option>
              <option value="Postres">Postres</option>
            </select>
          </label>
          <label>
            Precio
            <input type="number" name="precio" min="0.01" step="0.01" required>
          </label>
          <label class="check">
            <input type="checkbox" name="disponible" checked>
            Disponible
          </label>
        </div>
        <div class="form-actions">
          <button type="button" class="btn btn-small btn-secondary" id="cancelar-producto" hidden>Cancelar edición</button>
          <button type="submit" class="btn" id="guardar-producto">Guardar producto</button>
        </div>
      </form>
    </section>

    <section class="card">
      <h2>Carta</h2>

      <form id="filtro-form" class="form-block">
        <div class="form-grid">
          <label>
            Categoría
            <select name="categoria">
              <option value="">Todas</option>
              <option value="Entradas">Entradas</option>
              <option value="Bebidas">Bebidas</option>
              <option value="Platos fuertes">Platos fuertes</option>
              <option value="Postres">Postres</option>
            </select>
          </label>
          <label>
            Disponibilidad
            <select name="disponible">
              <option value="">Todas</option>
              <option value="true">Disponibles</option>
              <option value="false">Agotados</option>
            </select>
          </label>
          <label>
            Buscar por nombre
            <input type="text" name="buscar">
          </label>
        </div>
        <div class="form-actions">
          <button type="button" class="btn btn-small btn-secondary" id="limpiar-filtro">Limpiar</button>
          <button type="submit" class="btn btn-small">Buscar</button>
        </div>
      </form>

      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>Nombre</th>
              <th>Categoría</th>
              <th>Precio</th>
              <th>Disponible</th>
              <th>Acciones</th>
            </tr>
          </thead>
          <tbody id="productos-body"></tbody>
        </table>
      </div>
    </section>
  </div>

  <script src="../../assets/js/api/api.js"></script>
  <script src="../../assets/js/utils/helpers.js"></script>
  <script src="../../assets/js/components/navbar.js"></script>
  <script src="../../assets/js/pages/productos.js"></script>
</body>
</html>
