<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Iniciar sesión - Restaurante XYZ</title>
  <link rel="stylesheet" href="../../assets/css/styles.css">
</head>
<body>
  <div class="login-wrap">
    <div class="login-shell">
      <div class="login-card">
        <h2>Iniciar sesión</h2>
        <p class="login-sub">Ingresa con tu cuenta para abrir el servicio.</p>

        <form id="login-form">
          <div class="form-grid">
            <label>
              Usuario o correo
              <input type="text" name="usuario" required autocomplete="username">
            </label>
            <label>
              Contraseña
              <input type="password" name="contrasena" required autocomplete="current-password">
            </label>
          </div>
          <button type="submit" class="btn">Ingresar</button>
        </form>
      </div>
    </div>
  </div>

  <script src="../../assets/js/api/api.js"></script>
  <script src="../../assets/js/utils/helpers.js"></script>
  <script src="../../assets/js/pages/login.js"></script>
</body>
</html>
