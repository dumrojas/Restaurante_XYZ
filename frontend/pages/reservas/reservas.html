<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reservas - Restaurante XYZ</title>
  <link rel="stylesheet" href="../../assets/css/styles.css">
</head>
<body>
  <div class="container split">
    <header class="page-head">
      <h1>Reservas</h1>
      <p>Mesas del salón y reservas del servicio.</p>
    </header>

    <div class="stack">
      <section class="card">
        <h2>Mesas</h2>
        <div class="mesa-grid" id="mesas-body"></div>

        <form id="mesa-form" class="form-block">
          <div class="form-grid">
            <label>
              Número o nombre
              <input type="text" name="numero" required>
            </label>
            <label>
              Capacidad
              <input type="number" name="capacidad" min="1" required>
            </label>
            <label>
              Estado
              <select name="estado">
                <option value="disponible">Disponible</option>
                <option value="reservada">Reservada</option>
                <option value="ocupada">Ocupada</option>
                <option value="fuera_servicio">Fuera de servicio</option>
              </select>
            </label>
          </div>
          <div class="form-actions">
            <button type="button" class="btn btn-small btn-secondary" id="cancelar-mesa" hidden>Cancelar edición</button>
            <button type="submit" class="btn btn-small" id="guardar-mesa">Guardar mesa</button>
          </div>
        </form>
      </section>
    </div>

    <section class="card">
      <h2>Reservas del servicio</h2>

      <form id="filtro-form" class="form-block">
        <div class="form-grid">
          <label>
            Fecha
            <input type="date" name="fecha">
          </label>
          <label>
            Cliente
            <input type="text" name="cliente" placeholder="Buscar por cliente">
          </label>
          <label>
            Estado
            <select name="estado">
              <option value="">Todos</option>
              <option value="pendiente">Pendiente</option>
              <option value="confirmada">Confirmada</option>
              <option value="finalizada">Finalizada</option>
              <option value="cancelada">Cancelada</option>
            </select>
          </label>
        </div>
        <div class="form-actions">
          <button type="button" class="btn btn-small btn-secondary" id="limpiar-filtro">Limpiar</button>
          <button type="submit" class="btn btn-small">Buscar</button>
        </div>
      </form>

      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>Cliente</th>
              <th>Fecha</th>
              <th>Hora</th>
              <th>Mesa</th>
              <th>Estado</th>
              <th>Acciones</th>
            </tr>
          </thead>
          <tbody id="reservas-body"></tbody>
        </table>
      </div>
    </section>

    <section class="card full">
      <h2 id="titulo-reserva">Nueva reserva</h2>
      <form id="reserva-form">
        <div class="form-grid">
          <label>
            Cliente
            <input type="text" name="nombre_cliente" required>
          </label>
          <label>
            Teléfono
            <input type="text" name="telefono_cliente" required>
          </label>
          <label>
            Personas
            <input type="number" name="cantidad_personas" min="1" required>
          </label>
          <label>
            Fecha
            <input type="date" name="fecha" required>
          </label>
          <label>
            Hora
            <input type="time" name="hora" required>
          </label>
          <label>
            Mesa
            <select name="mesa_id" id="mesa-select" required></select>
          </label>
          <label>
            Observaciones
            <input type="text" name="observaciones">
          </label>
        </div>
        <div class="form-actions">
          <button type="button" class="btn btn-small btn-secondary" id="cancelar-reserva" hidden>Cancelar edición</button>
          <button type="submit" class="btn" id="guardar-reserva">Guardar reserva</button>
        </div>
      </form>
    </section>
  </div>

  <script src="../../assets/js/api/api.js"></script>
  <script src="../../assets/js/utils/helpers.js"></script>
  <script src="../../assets/js/components/navbar.js"></script>
  <script>
    if (requireSession()) {
      renderNav('reservas');

      const mesasBody = document.getElementById('mesas-body');
      const mesaForm = document.getElementById('mesa-form');
      const guardarMesa = document.getElementById('guardar-mesa');
      const cancelarMesa = document.getElementById('cancelar-mesa');
      const reservasBody = document.getElementById('reservas-body');
      const mesaSelect = document.getElementById('mesa-select');
      const reservaForm = document.getElementById('reserva-form');
      const guardarReserva = document.getElementById('guardar-reserva');
      const cancelarReserva = document.getElementById('cancelar-reserva');
      const tituloReserva = document.getElementById('titulo-reserva');
      const filtroForm = document.getElementById('filtro-form');

      const hoy = new Date();
      const fechaMinima = new Date(hoy.getTime() - hoy.getTimezoneOffset() * 60000)
        .toISOString()
        .slice(0, 10);
      reservaForm.fecha.min = fechaMinima;

      const estadosMesa = ['disponible', 'reservada', 'ocupada', 'fuera_servicio'];
      let mesasPorId = {};
      let reservasPorId = {};
      let filtrosActuales = {};
      let editandoMesaId = null;
      let editandoReservaId = null;

      function nombreMesa(id) {
        return mesasPorId[id] ? mesasPorId[id].numero : 'Mesa ' + id;
      }

      function opcionesEstadoMesa(seleccionado) {
        return estadosMesa
          .map((estado) =>
            '<option value="' + estado + '"' + (estado === seleccionado ? ' selected' : '') + '>' +
              escapeHtml(formatEstado(estado)) + '</option>'
          )
          .join('');
      }

      function reiniciarFormularioMesa() {
        editandoMesaId = null;
        mesaForm.reset();
        guardarMesa.textContent = 'Guardar mesa';
        cancelarMesa.hidden = true;
      }

      async function cargarMesas() {
        try {
          const mesas = await api.reservas.mesas();
          const mesaSeleccionada = mesaSelect.value;

          mesasPorId = {};
          mesasBody.innerHTML = '';
          mesaSelect.innerHTML = '<option value="">Selecciona una mesa</option>';

          if (!mesas.length) {
            mesasBody.innerHTML = '<p class="empty">No hay mesas registradas</p>';
            return;
          }

          mesas.forEach((mesa) => {
            mesasPorId[mesa.id] = mesa;

            const numero = String(mesa.numero).replace(/\D/g, '') || mesa.numero;
            const tarjeta = document.createElement('div');
            tarjeta.className = 'mesa-card';
            tarjeta.innerHTML =
              '<div class="mesa-line">' +
                '<div class="mesa-tag">' + escapeHtml(numero) + '</div>' +
                '<div class="mesa-info">' +
                  '<span class="mesa-name">' + escapeHtml(mesa.numero) + '</span>' +
                  '<span class="mesa-cap">' + escapeHtml(mesa.capacidad) + ' personas</span>' +
                '</div>' +
                '<span class="badge badge-' + escapeHtml(mesa.estado) + '">' +
                  escapeHtml(formatEstado(mesa.estado)) + '</span>' +
              '</div>' +
              '<div class="mesa-actions">' +
                '<button type="button" class="btn btn-small btn-secondary" data-mesa-editar="' +
                  mesa.id + '">Editar</button>' +
                '<select class="estado-mesa" data-mesa-estado="' + mesa.id + '">' +
                  opcionesEstadoMesa(mesa.estado) + '</select>' +
                '<button type="button" class="btn btn-small" data-mesa-cambiar="' +
                  mesa.id + '">Aplicar</button>' +
              '</div>';
            mesasBody.appendChild(tarjeta);

            const opcion = document.createElement('option');
            opcion.value = mesa.id;
            opcion.textContent = mesa.numero + ' (' + mesa.capacidad + ' personas)';

            if (mesa.estado === 'fuera_servicio') {
              opcion.disabled = true;
            }

            mesaSelect.appendChild(opcion);
          });

          if (mesaSeleccionada) {
            mesaSelect.value = mesaSeleccionada;
          }
        } catch (error) {
          showMessage(error.message || 'No se pudieron cargar las mesas', 'error');
        }
      }

      async function cargarReservas() {
        try {
          const reservas = await api.reservas.reservas(filtrosActuales);

          reservasBody.innerHTML = '';
          reservasPorId = {};

          if (!reservas.length) {
            reservasBody.innerHTML = '<tr><td colspan="6" class="empty">No hay reservas registradas</td></tr>';
            return;
          }

          reservas.forEach((reserva) => {
            reservasPorId[reserva.id] = reserva;
            const acciones = [];

            if (reserva.estado === 'pendiente' || reserva.estado === 'confirmada') {
              acciones.push(
                '<button type="button" class="btn btn-small btn-secondary" data-accion="editar" data-id="' +
                  reserva.id + '">Editar</button>'
              );
            }

            if (reserva.estado === 'pendiente') {
              acciones.push(
                '<button type="button" class="btn btn-small" data-accion="confirmada" data-id="' +
                  reserva.id + '">Confirmar</button>'
              );
            }

            if (reserva.estado === 'confirmada') {
              acciones.push(
                '<button type="button" class="btn btn-small" data-accion="finalizada" data-id="' +
                  reserva.id + '">Finalizar</button>'
              );
            }

            if (reserva.estado === 'pendiente' || reserva.estado === 'confirmada') {
              acciones.push(
                '<button type="button" class="btn btn-small btn-danger" data-accion="cancelar" data-id="' +
                  reserva.id + '">Cancelar</button>'
              );
            }

            const fila = document.createElement('tr');
            fila.innerHTML =
              '<td>' + escapeHtml(reserva.nombre_cliente) + '</td>' +
              '<td>' + escapeHtml(formatDate(reserva.fecha)) + '</td>' +
              '<td>' + escapeHtml(formatTime(reserva.hora)) + '</td>' +
              '<td>' + escapeHtml(nombreMesa(reserva.mesa_id)) + '</td>' +
              '<td><span class="badge badge-' + escapeHtml(reserva.estado) + '">' +
                escapeHtml(formatEstado(reserva.estado)) + '</span></td>' +
              '<td><div class="actions">' + (acciones.join('') || '—') + '</div></td>';
            reservasBody.appendChild(fila);
          });
        } catch (error) {
          showMessage(error.message || 'No se pudieron cargar las reservas', 'error');
        }
      }

      mesasBody.addEventListener('click', async (event) => {
        const editar = event.target.closest('button[data-mesa-editar]');
        const cambiar = event.target.closest('button[data-mesa-cambiar]');

        if (editar) {
          const mesa = mesasPorId[editar.dataset.mesaEditar];

          if (!mesa) {
            return;
          }

          editandoMesaId = mesa.id;
          mesaForm.numero.value = mesa.numero;
          mesaForm.capacidad.value = mesa.capacidad;
          mesaForm.estado.value = mesa.estado;
          guardarMesa.textContent = 'Actualizar mesa';
          cancelarMesa.hidden = false;
          mesaForm.scrollIntoView({ behavior: 'smooth', block: 'center' });
          return;
        }

        if (cambiar) {
          const id = cambiar.dataset.mesaCambiar;
          const select = mesasBody.querySelector('select[data-mesa-estado="' + id + '"]');

          cambiar.disabled = true;

          try {
            await api.reservas.cambiarEstadoMesa(id, select.value);
            showMessage('Estado de la mesa actualizado', 'success');
            await cargarMesas();
          } catch (error) {
            showMessage(error.message || 'No se pudo cambiar el estado', 'error');
            cambiar.disabled = false;
          }
        }
      });

      cancelarMesa.addEventListener('click', reiniciarFormularioMesa);

      mesaForm.addEventListener('submit', async (event) => {
        event.preventDefault();

        if (!validateRequired(mesaForm)) {
          return;
        }

        const capacidad = Number(mesaForm.capacidad.value);

        if (!Number.isInteger(capacidad) || capacidad < 1) {
          showMessage('La capacidad debe ser mayor a cero', 'error');
          return;
        }

        const mesa = {
          numero: mesaForm.numero.value.trim(),
          capacidad,
          estado: mesaForm.estado.value,
        };

        guardarMesa.disabled = true;

        try {
          if (editandoMesaId) {
            await api.reservas.actualizarMesa(editandoMesaId, mesa);
            showMessage('Mesa actualizada', 'success');
          } else {
            await api.reservas.crearMesa(mesa);
            showMessage('Mesa guardada', 'success');
          }

          reiniciarFormularioMesa();
          await cargarMesas();
        } catch (error) {
          showMessage(error.message || 'No se pudo guardar la mesa', 'error');
        } finally {
          guardarMesa.disabled = false;
        }
      });

      reservasBody.addEventListener('click', async (event) => {
        const boton = event.target.closest('button[data-accion]');

        if (!boton) {
          return;
        }

        if (boton.dataset.accion === 'editar') {
          const reserva = reservasPorId[boton.dataset.id];

          if (!reserva) {
            return;
          }

          editandoReservaId = reserva.id;
          reservaForm.nombre_cliente.value = reserva.nombre_cliente;
          reservaForm.telefono_cliente.value = reserva.telefono_cliente;
          reservaForm.cantidad_personas.value = reserva.cantidad_personas;
          reservaForm.fecha.value = reserva.fecha;
          reservaForm.hora.value = String(reserva.hora).slice(0, 5);
          mesaSelect.value = reserva.mesa_id;
          reservaForm.observaciones.value = reserva.observaciones || '';
          tituloReserva.textContent = 'Editar reserva';
          guardarReserva.textContent = 'Actualizar reserva';
          cancelarReserva.hidden = false;
          reservaForm.scrollIntoView({ behavior: 'smooth', block: 'center' });
          return;
        }

        boton.disabled = true;

        try {
          if (boton.dataset.accion === 'cancelar') {
            await api.reservas.cancelarReserva(boton.dataset.id);
            showMessage('Reserva cancelada', 'success');
          } else {
            await api.reservas.cambiarEstadoReserva(boton.dataset.id, boton.dataset.accion);
            showMessage('Reserva actualizada', 'success');
          }

          await cargarReservas();
        } catch (error) {
          showMessage(error.message || 'No se pudo actualizar la reserva', 'error');
          boton.disabled = false;
        }
      });

      function reiniciarFormularioReserva() {
        editandoReservaId = null;
        reservaForm.reset();
        reservaForm.fecha.min = fechaMinima;
        tituloReserva.textContent = 'Nueva reserva';
        guardarReserva.textContent = 'Guardar reserva';
        cancelarReserva.hidden = true;
      }

      cancelarReserva.addEventListener('click', reiniciarFormularioReserva);

      reservaForm.addEventListener('submit', async (event) => {
        event.preventDefault();

        if (!validateRequired(reservaForm)) {
          return;
        }

        const reserva = {
          nombre_cliente: reservaForm.nombre_cliente.value.trim(),
          telefono_cliente: reservaForm.telefono_cliente.value.trim(),
          cantidad_personas: Number(reservaForm.cantidad_personas.value),
          fecha: reservaForm.fecha.value,
          hora: reservaForm.hora.value,
          mesa_id: Number(reservaForm.mesa_id.value),
          observaciones: reservaForm.observaciones.value.trim(),
        };

        guardarReserva.disabled = true;

        try {
          if (editandoReservaId) {
            await api.reservas.actualizarReserva(editandoReservaId, reserva);
            showMessage('Reserva actualizada', 'success');
          } else {
            await api.reservas.crearReserva(reserva);
            showMessage('Reserva guardada', 'success');
          }

          reiniciarFormularioReserva();
          await cargarReservas();
        } catch (error) {
          showMessage(error.message || 'No se pudo guardar la reserva', 'error');
        } finally {
          guardarReserva.disabled = false;
        }
      });

      filtroForm.addEventListener('submit', (event) => {
        event.preventDefault();
        filtrosActuales = {
          fecha: filtroForm.fecha.value,
          cliente: filtroForm.cliente.value.trim(),
          estado: filtroForm.estado.value,
        };
        cargarReservas();
      });

      document.getElementById('limpiar-filtro').addEventListener('click', () => {
        filtroForm.reset();
        filtrosActuales = {};
        cargarReservas();
      });

      (async () => {
        await cargarMesas();
        await cargarReservas();
      })();
    }
  </script>
</body>
</html>
